[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veilguard-client"
version = "0.1.0"
description = "Veilguard client daemon — local tool execution for cloud-hosted Veilguard AI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Phishield"}]

dependencies = [
    "websockets>=12.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Windows tray + toast UI.  build.bat installs this group before
# running PyInstaller; the Linux sandbox container ignores it and uses
# requirements-headless.txt instead (no tray on a server).
windows = [
    "pystray>=0.19.5,<0.20",
    "Pillow>=10.0,<12",
    "winotify>=1.1.0,<2",
]

[project.scripts]
veilguard = "veilguard_client:main"

[tool.setuptools]
py-modules = ["veilguard_client", "setup_server"]
packages = ["daemon"]
