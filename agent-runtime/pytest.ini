[pytest]
asyncio_mode = auto
# NOTE: include every real test dir. `tests` alone silently excluded the
# 178 tests under app/proposals/tests + app/ledger/tests (UAT finding F7,
# 2026-06-01) — which hid 3 failing tests. `demo/` is deliberately NOT
# listed: its `test_e2e_loop.py` has import-time side effects + expects a
# live container.
testpaths = tests app/proposals/tests app/ledger/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
