services:
  # === LibreChat (with Python for MCP tools) ===
  api:
    build:
      context: .
      dockerfile: Dockerfile.librechat
    ports:
      - "${PORT:-3080}:${PORT:-3080}"
    # Linux Docker doesn't auto-create host.docker.internal (unlike
    # Docker Desktop on Mac/Windows). LibreChat's MCP config points at
    # host.docker.internal:{8809,8810,8811} to reach sub-agents/forge/
    # TCMM which run as bare Python processes on the host. Without
    # host-gateway, MCP SSE connections fail silently and tools don't
    # show up in the UI.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_started
      meilisearch:
        condition: service_started
      pii-proxy:
        condition: service_healthy
    restart: always
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - NO_INDEX=true
      - WORKSPACE_ROOT=/workspace
      # Phase 3/4 /api/veilguard-client/* proxy → agent-runtime.  Use the
      # compose-network DNS (fast, ~500ms) instead of the default
      # `host.docker.internal` which has cold-DNS latency through Docker
      # Desktop that occasionally trips the proxy's 8s timeout → HTTP 502
      # in the Work Queue sidebar.  Caught 2026-05-27 — first refresh of
      # the day routinely hit the slow path.
      - VEILGUARD_AGENT_RUNTIME_URL=http://agent-runtime:5000
    volumes:
      - ./librechat.yaml:/app/librechat.yaml
      # Note: librechat.yaml mcpServers section references /app/mcp-tools/
      # (matches VM).  We mount our renamed `services/` dir to that path
      # so the existing config keeps working unchanged.
      - ./services:/app/mcp-tools
      - ./workspace:/workspace
      - librechat-images:/app/client/public/images
      - librechat-logs:/app/api/logs
      # DELIBERATELY NOT mounting ./librechat-src/client/dist:/app/client/dist —
      # see memory `architecture_librechat_fork`.  The host dist is stale
      # and shadows the image's baked client (cyber.css + index.html link).
      # Cyber theme is now baked into the image via Dockerfile.librechat.
      # Custom Veilguard backend routes (authenticated proxy for the
      # client-daemon install flow).  Only the specific files we added
      # or modified — mounting the whole api/ directory would shadow
      # everything in the stock image.
      - ./librechat-src/api/server/routes/veilguardClient.js:/app/api/server/routes/veilguardClient.js:ro
      - ./librechat-src/api/server/routes/index.js:/app/api/server/routes/index.js:ro
      - ./librechat-src/api/server/experimental.js:/app/api/server/experimental.js:ro
      - ./librechat-src/api/server/index.js:/app/api/server/index.js:ro

  # === MongoDB ===
  mongodb:
    image: mongo:7.0
    restart: always
    volumes:
      - mongo-data:/data/db
    command: mongod --noauth

  # === MeiliSearch ===
  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: always
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-changeme}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili-data:/meili_data

  # === Admin Dashboard (read-only ops console) ===
  admin:
    build: ./services/admin-dashboard
    ports:
      - "8820:8820"
    depends_on:
      mongodb:
        condition: service_started
    # TCMM runs as a bare Python process on the host; reach it via the
    # docker host gateway just like api/ and pii-proxy/ do.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MONGO_DB=LibreChat
      - TCMM_URL=http://host.docker.internal:8811
      - ADMIN_LANCE_DIR=/tcmm-data/veilguard/tcmm.db
      - ADMIN_HOST=0.0.0.0
      - ADMIN_PORT=8820
      # [DASHBOARD_PG_2026-06-03] lance_stats.py defaults TCMM_STORAGE to "lance"
      # — without these the dashboard reads the stale Lance file instead of the
      # migrated Postgres. Match the agent-runtime DSN (tcmm-pg on host :5433).
      - TCMM_STORAGE=postgres
      - TCMM_DATABASE_URL=postgresql://tcmm:tcmm@host.docker.internal:5433/tcmm
    volumes:
      # Bind-mount source so edits hot-reload without rebuild
      - ./services/admin-dashboard:/app
      # Lance directory (TCMM + PII audit live here). Mounted RW because
      # lancedb's `connect()` opens version + lock files even on a
      # read-only query — :ro causes "Read-only file system" errors.
      - ./tcmm-data:/tcmm-data
      # Host /proc for CPU + memory metrics. Read-only, no privileged.
      # On Docker Desktop the "host" is the LinuxKit VM, so numbers
      # will reflect that VM rather than Windows itself; that's fine
      # for dev and exactly right for prod (the VM == the box).
      - /proc:/host/proc:ro
    restart: unless-stopped

  # === Veilguard Agent Runtime (FastAPI + Claude Agent SDK) ===
  # Embedded SDK runtime that owns the LLM-tool-LLM loop for
  # Anthropic-bound conversations.  pii-proxy routes Anthropic calls
  # here (instead of going direct) when the request is multi-agent-aware.
  # Other providers (OpenAI, Gemini, xAI) keep going direct via pii-proxy.
  agent-runtime:
    build: ./agent-runtime
    ports:
      - "5000:5000"
    # Same host-gateway pattern as pii-proxy / admin so TCMM (running
    # on the host) and sub-agents (also host) are reachable.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Hot-reload during dev; bake into image for prod.
      - ./agent-runtime/app:/app/app
      # 2026-05-25: agent-runtime's runtime.py now drives the unified
      # `Agent.run_turn` pipeline (same code as pii-proxy's ChatAgent
      # path).  Mount the agent/ + llm/ + pii/ packages from the repo
      # root so `from agent import agent_for, TurnContext` works inside
      # the container.  Without these mounts the Director query fails
      # with ModuleNotFoundError: No module named 'agent'.
      # PYTHONPATH=/ (set under environment:) puts them on the import path.
      - ./agent:/agent:ro
      - ./llm:/llm:ro
      - ./pii:/pii:ro
      # TCMM adapter source tree — adapter.py probes TCMM_ROOT for the
      # AnthropicGenerationAdapter via importlib.  Same read-only mount
      # pii-proxy uses (see pii-proxy.volumes).
      - ~/.gemini/antigravity/tcmm/TCMM:/opt/tcmm:ro
      # OAuth bearer creds — adapter writes the long-lived setup-token
      # into ~/.claude/.credentials.json on first use, then TCMM's
      # adapter reads it directly.  Same RW mount pii-proxy uses.
      - ~/.claude:/root/.claude
      # Persona files + CONSTITUTION.md — same dir LibreChat / sub-agents
      # see via different mounts.  Mounted read-only here; user edits
      # happen via the sidebar or direct file edit, never from inside
      # this container.
      - ./agents:/app/agents:ro
      - ./logs:/app/logs
      # Lance dir for the new decision-ledger tables (agent_tasks,
      # task_proposals, etc.) AND the shared pii_audit table.  Must be
      # writable; agent-runtime must run as the same OS user that owns
      # the dir (typically rudol on prod VM — see memory:
      # architecture_lance_index_perms for the catastrophe pattern).
      - ./tcmm-data:/tcmm-data
      # [WORKSPACE_FS_2026_05_29]  Server-side team workspace.  ICs write
      # artifacts here (team/drafts/...) and critics read them — all
      # server-side per spec §3.5 ("the org lives on the VM").  Replaces
      # the broken daemon-routed read_file/write_file path that looped
      # critics when sub-agents was offline.  Mounted writable.
      - ./agent-workspace:/workspace
    env_file:
      - .env
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_API_URL=${ANTHROPIC_API_URL:-https://api.anthropic.com}
      - AGENT_RUNTIME_PORT=5000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ANTHROPIC_DUMP_REQUESTS=1
      - TCMM_ENABLED=${TCMM_ENABLED:-true}
      - TCMM_URL=${TCMM_URL:-http://host.docker.internal:8811}
      # [RETIRE_LANCE_2026-06-04] Pin Postgres for TCMM memory + ledger + audit.
      # Without these the Python defaults silently fall back to LanceDB (the
      # recurring "localhost on lancedb" bug). host.docker.internal:5433 reaches
      # the tcmm-pg container from both containers and host processes.
      - TCMM_STORAGE=${TCMM_STORAGE:-postgres}
      - TCMM_VECTOR=${TCMM_VECTOR:-postgres}
      - TCMM_SPARSE=${TCMM_SPARSE:-postgres}
      - TCMM_DATABASE_URL=${TCMM_DATABASE_URL:-postgresql://tcmm:tcmm@host.docker.internal:5433/tcmm}
      # [PII_RENDER_REDACT_2026_05_30] memory redacted at render → boundary
      # skips re-scanning system blocks (only redacts the latest prompt).
      - VEILGUARD_REDACT_IN_RENDER=${VEILGUARD_REDACT_IN_RENDER:-1}
      - SUB_AGENTS_URL=${SUB_AGENTS_URL:-http://host.docker.internal:8809}
      - VEILGUARD_INTERNAL_SECRET=${VEILGUARD_INTERNAL_SECRET:-}
      - AGENTS_DIR=/app/agents
      - LEDGER_DB_PATH=/tcmm-data/veilguard/tcmm.db
      - VEILGUARD_AUDIT_DB_PATH=${VEILGUARD_AUDIT_DB_PATH:-/tcmm-data/veilguard/tcmm.db}
      - CACHE_TTL_DEFAULT=${CACHE_TTL_DEFAULT:-1h}
      - APPROVAL_TIMEOUT_S=${APPROVAL_TIMEOUT_S:-120}
      - APPROVAL_FAIL_CLOSED=${APPROVAL_FAIL_CLOSED:-true}
      # PYTHONPATH=/ so the bind-mounted /agent, /llm, /pii packages
      # at the container root are importable.  Without this,
      # `from agent import agent_for, TurnContext` (inside runtime.py)
      # raises ModuleNotFoundError.
      - PYTHONPATH=/
      # OAuth bearer for the live AnthropicAdapter — same env var
      # pii-proxy uses.  Adapter writes this into the bind-mounted
      # ~/.claude/.credentials.json on first call so TCMM's adapter
      # picks it up.
      - VEILGUARD_CLAUDE_OAUTH_TOKEN=${VEILGUARD_CLAUDE_OAUTH_TOKEN:-}
      # TCMM_ROOT points at the read-only bind mount above.
      - TCMM_ROOT=/opt/tcmm
      # CLAUDE_SSO=1 routes the adapter through TCMM /generate (OAuth
      # bearer path).  Same as pii-proxy's flag.
      - CLAUDE_SSO=1
      # [PROMPT_CACHE_DIAG_2026_05_28] Dump every Anthropic request +
      # response to /tmp/anthropic_dump.jsonl so we can verify
      # cache_control markers actually leave the adapter for the API.
      - ANTHROPIC_DUMP_REQUESTS=${ANTHROPIC_DUMP_REQUESTS:-0}
      # [INBOX_POLLER_OPT_OUT_2026_05_29]  Disable background IC
      # dispatch when set to 1.  Useful for pure Director latency
      # testing — researchers/critics won't compete for the Anthropic
      # client.  But the multi-agent flow won't execute either, so
      # the Director will appear to create tasks that never finish.
      # Default: ENABLED (let the org actually work).  Flip to 1 only
      # when measuring foreground latency in isolation.
      - VEILGUARD_INBOX_POLLER_DISABLED=${VEILGUARD_INBOX_POLLER_DISABLED:-0}
      # [WORKSPACE_FS_2026_05_29]  Root of the server-side team workspace
      # (bind-mounted above).  read_file/write_file/edit_file resolve
      # paths under here, sandboxed (no escape).
      - VEILGUARD_WORKSPACE_ROOT=/workspace
      # [DISPATCH_TIMING_ENV_2026_05_29]  The local Windows Docker bind-mount
      # runs Lance ~10x slower than the prod Linux VM, so a single IC
      # dispatch (recall + multi-turn LLM + critic review) blows past the
      # prod-tuned 270s timeout and gets WRONGLY force-cancelled.  Bump both
      # locally (invariant: dispatch timeout < lease).  On prod these can be
      # left unset to use the 300/270 defaults.
      - VEILGUARD_LEASE_DURATION_S=${VEILGUARD_LEASE_DURATION_S:-1200}
      - VEILGUARD_DISPATCH_TIMEOUT_S=${VEILGUARD_DISPATCH_TIMEOUT_S:-1080}
      # [BLAS_THREAD_PIN_2026_05_29]  THE redaction-under-concurrency fix.
      # spaCy/Presidio NER uses OpenBLAS, which defaults to one thread PER
      # CORE (16 here).  When N agents redact concurrently during a fan-out
      # (2 researchers + 2 critics), that's N×16 = 50-64 BLAS threads
      # thrashing on an oversubscribed box → each redaction balloons ~4×
      # (measured: realistic 30k-token redact 7.7s single → ~33s at
      # 4-concurrent).  Pinning to 1 thread each removes the oversubscription
      # → 4-concurrent drops to ~15s (2.2× faster).  Prod's 8 real cores
      # oversubscribe far less, which is why redaction "works on prod" — this
      # is a many-small-inference best practice regardless.
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      # [PII_PIPELINE_TRIM_2026_05_29] PERSON-name NER stays ON (default 0).
      # Only the unused spaCy dependency PARSER is dropped (in code,
      # unconditionally) — Presidio never consumes the parse, so this is a
      # pure ~34% speedup with ZERO detection change. Regex-only mode
      # (which WOULD drop PERSON) is opt-in via PII_REGEX_ONLY=1 and is
      # NOT enabled.
      - PII_REGEX_ONLY=${PII_REGEX_ONLY:-0}
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # === Veilguard Agent Proxy (was: PII Gateway; renamed 2026-05-23) ===
  # Source dir renamed pii-proxy/ → agent-proxy/ when the LibreChat
  # entry point moved to ChatAgent-based routing.  Docker service NAME
  # kept as `pii-proxy` so internal Docker network DNS
  # (http://pii-proxy:4000 from librechat.yaml etc.) still resolves
  # without touching every consumer.
  pii-proxy:
    build: ./agent-proxy
    ports:
      - "4000:4000"
    # Same reason as api: TCMM_URL points at host.docker.internal:8811
    # for the memory integration. On Linux this needs host-gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./agent-proxy/app:/app/app
      - ./logs:/app/logs
      # Mount the TCMM Lance directory so audit_db.py can write to the
      # pii_audit table alongside TCMM's archive/sparse/dream tables.
      # We speak raw LanceDB here — no TCMM package code ever runs in
      # this container — but we share the on-disk store so ops only
      # has to back up one directory for both services.
      - ./tcmm-data:/tcmm-data
      # 2026-05-24 [PR #5a]: when VEILGUARD_USE_CHAT_AGENT=1 the new
      # handler at app/chat_agent_handler.py needs the agent/llm/pii
      # packages importable.  Mount them next to /app so the handler's
      # sys.path probe (parents[2] = /app/..  → /) sees them.
      # Also mount TCMM root for AnthropicAdapter's sys.path import.
      - ./agent:/agent
      - ./llm:/llm
      - ./pii:/pii
      # TCMM root for AnthropicAdapter — read-only since the proxy
      # never writes there.  Override TCMM_ROOT env if your local
      # tree lives somewhere else.
      - ~/.gemini/antigravity/tcmm/TCMM:/opt/tcmm:ro
      # Claude OAuth credentials — READ-WRITE so the adapter can
      # persist refreshed tokens back to disk.  TCMM adapter does
      # `.tmp → .credentials.json` atomic rename within ~/.claude/;
      # RO breaks the refresh path silently and every token-expiry
      # turns into an Anthropic 401.  Container runs as root and the
      # host file is owned by the user — chmod adjustment may be
      # required on Linux hosts.  On Windows / Docker Desktop the
      # mount is permissive enough out of the box.
      - ~/.claude:/root/.claude
    env_file:
      - .env
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      # [BLAS_THREAD_PIN_2026_05_29] Same OpenBLAS oversubscription fix as
      # agent-runtime — the proxy runs the same Presidio/spaCy redactor and
      # thrashes when concurrent chats redact at once. Pin to 1 thread each.
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - ANTHROPIC_API_URL=${ANTHROPIC_API_URL:-https://api.anthropic.com}
      - OPENAI_API_URL=${OPENAI_API_URL:-https://api.openai.com}
      - GEMINI_API_URL=${GEMINI_API_URL:-https://generativelanguage.googleapis.com}
      - XAI_API_URL=${XAI_API_URL:-https://api.x.ai}
      # TCMM root is mounted RO at /opt/tcmm so the host TCMM
      # service (8811) keeps sole ownership.  Redirect TCMM's
      # own logger to a writable path so its `core.tcmm_logging`
      # module can initialize.  Without this, importing TCMM's
      # adapter raises OSError on FileHandler open, the OAuth
      # refresh path crashes silently, and every token-expired
      # turn returns 401 from Anthropic.
      - TCMM_LOG_DIR=/tmp/tcmm-logs
      - PII_PROXY_PORT=4000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MIN_SCORE=${MIN_SCORE:-0.7}
      - TCMM_ENABLED=${TCMM_ENABLED:-false}
      - TCMM_URL=${TCMM_URL:-http://host.docker.internal:8811}
      # [RETIRE_LANCE_2026-06-04] Pin Postgres for pii_audit + session_store.
      # The proxy WRITES the pii_audit LLM-call log; with these unset it wrote to
      # LanceDB while the admin dashboard reads Postgres -> "no LLM calls in the
      # dashboard". Aligns the writer with the reader.
      - TCMM_STORAGE=${TCMM_STORAGE:-postgres}
      - TCMM_VECTOR=${TCMM_VECTOR:-postgres}
      - TCMM_SPARSE=${TCMM_SPARSE:-postgres}
      - TCMM_DATABASE_URL=${TCMM_DATABASE_URL:-postgresql://tcmm:tcmm@host.docker.internal:5433/tcmm}
      # [PII_RENDER_REDACT_2026_05_30] skip re-redacting pre-redacted memory.
      - VEILGUARD_REDACT_IN_RENDER=${VEILGUARD_REDACT_IN_RENDER:-1}
      # Where audit_db.py writes the pii_audit table.  Must be the
      # same Lance directory TCMM opens on the host so rows live next
      # to archive / sparse / dream data.
      - VEILGUARD_AUDIT_DB_PATH=${VEILGUARD_AUDIT_DB_PATH:-/tcmm-data/veilguard/tcmm.db}
      # 2026-05-22: agent-runtime forwarding (Phase 0.1).  When true,
      # Anthropic-bound requests go to agent-runtime instead of direct.
      # USER_ALLOWLIST limits rollout (comma-separated user_ids; empty =
      # all users).  See pii-proxy/app/main.py:_handle_agent_runtime_request.
      - AGENT_RUNTIME_ENABLED=${AGENT_RUNTIME_ENABLED:-false}
      - AGENT_RUNTIME_URL=${AGENT_RUNTIME_URL:-http://agent-runtime:5000}
      - AGENT_RUNTIME_USER_ALLOWLIST=${AGENT_RUNTIME_USER_ALLOWLIST:-}
      - AGENT_RUNTIME_DEFAULT_AGENT=${AGENT_RUNTIME_DEFAULT_AGENT:-director}
    depends_on:
      agent-runtime:
        condition: service_started
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ──────────────────────────────────────────────────────────────────────
  # veilguard-sandbox — server-side headless client-daemon.
  #
  # Acts as the "machine" for server agents (sub-agents/tools/daemons.py,
  # multi-agent fanout) when the user's actual Windows daemon is offline.
  # Registers with the WS bridge as user_id="system:sandbox" using a
  # shared secret in .env (VEILGUARD_SANDBOX_TOKEN — must NOT be empty
  # in prod; if unset the sandbox identity is rejected by sub-agents'
  # validate_token and the container just sits idle).
  #
  # Tool routing:
  #   sub-agents.agentic.handle_tool checks SANDBOX_FALLBACK_TOOLS
  #   (read_file / search_files / grep / run_command) and falls over
  #   to the sandbox bridge when the user's own bridge is disconnected.
  #   Write tools (write_file / edit_file) are deliberately excluded —
  #   sandbox writes are ephemeral.
  #
  # Identity & trust:
  #   user_id=system:sandbox is hard-coded.  The approval gate in
  #   core/approval.py short-circuits this identity to "pre-approved"
  #   (no toast, no UI round-trip) since the sandbox is a system
  #   component, not a user.  Server agents that route through the
  #   sandbox must still pass their own upstream policy check.
  # ──────────────────────────────────────────────────────────────────────
  veilguard-sandbox:
    build:
      context: .
      dockerfile: services/client-daemon/Dockerfile.sandbox
    container_name: veilguard-sandbox
    environment:
      # WS endpoint where sub-agents (host process) exposes /ws/client.
      # Use host.docker.internal so the container can reach the host
      # process on macOS/Windows; on Linux add "extra_hosts" to map
      # host.docker.internal to host-gateway (already done elsewhere).
      - VEILGUARD_SERVER=${VEILGUARD_SANDBOX_SERVER:-ws://host.docker.internal:8809/ws/client}
      - VEILGUARD_USER_ID=system:sandbox
      - VEILGUARD_CLIENT_ID=veilguard-sandbox
      - VEILGUARD_TOKEN=${VEILGUARD_SANDBOX_TOKEN:-}
      - VEILGUARD_PROJECT_ROOT=/sandbox-workspace
      - VEILGUARD_HEADLESS=1
    extra_hosts:
      # Linux Docker doesn't auto-resolve host.docker.internal; this
      # makes the daemon reach the host's sub-agents process regardless
      # of platform.
      - "host.docker.internal:host-gateway"
    # Optional persistent workspace.  Commented-out by default — the
    # sandbox is meant to be ephemeral so each container restart gets
    # a clean slate.  To retain across restarts, uncomment the volume
    # mount + add `sandbox-workspace:` under top-level `volumes:`.
    # volumes:
    #   - sandbox-workspace:/sandbox-workspace
    restart: unless-stopped

volumes:
  mongo-data:
  meili-data:
  librechat-images:
  librechat-logs:
